# Источник данных Grafana — база приложения. Учётная запись только на чтение:
# её создаёт приложение при запуске (переменные GRAFANA_DB_* в файле .env).
apiVersion: 1

datasources:
  - name: Historian DB
    uid: historian-db
    type: postgres
    access: proxy
    url: ${DB_ADDRESS}
    user: ${GRAFANA_DB_USER}
    database: ${DB_NAME}
    isDefault: false
    editable: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: ${DB_NAME}
      sslmode: disable
      postgresVersion: 1600
      # Запросы дашборда работают и на обычном PostgreSQL (комплект без Docker)
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 4
      connMaxLifetime: 14400

  # Теги и скрипты без SQL: приложение отвечает Grafana как сервер Graphite (плагины не
  # нужны). Этот источник выбирается по умолчанию в новых панелях
  - name: Теги и скрипты
    uid: historian-app
    type: graphite
    access: proxy
    url: ${APP_URL}/graphite
    isDefault: true
    editable: false
    jsonData:
      graphiteVersion: "1.1"
      graphiteType: default
