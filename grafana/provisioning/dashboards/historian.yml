# Готовые дашборды — файлы *.json из папки grafana/dashboards проекта.
# Изменения, сохранённые в интерфейсе Grafana, живут до изменения файла.
apiVersion: 1

providers:
  - name: historian2grafana
    orgId: 1
    folder: ""
    type: file
    disableDeletion: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: ${DASHBOARDS_DIR}

  # Дашборды, сохранённые на странице «Графики». Папку заполняет приложение, удаляются они там же
  - name: historian2grafana-saved
    orgId: 1
    folder: "Сохранённые"
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 3
    options:
      path: ${SAVED_DASHBOARDS_DIR}
